<svg viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradients -->
    <linearGradient id="accentGrad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1">
        <animate attributeName="offset" values="0%;25%;50%;75%;0%" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#22D3EE;stop-opacity:1">
        <animate attributeName="offset" values="50%;75%;100%;25%;50%" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1">
        <animate attributeName="offset" values="100%;125%;150%;75%;100%" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="asciiGrad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1">
        <animate attributeName="stop-color" values="#22D3EE;#7C3AED;#22D3EE" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="bgGrad1-dark" cx="20%" cy="30%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="bgGrad2-dark" cx="80%" cy="70%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="bgGrad3-dark" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow-dark">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAscii-dark">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blurGlass-dark">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>

    <filter id="noise-dark">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1"/>
    </filter>

    <!-- Masks for sequential reveal -->
    <mask id="revealMask">
      <rect width="1180" height="610" fill="black"/>
      <rect x="0" y="0" width="1180" height="610" fill="white">
        <animate attributeName="height" from="0" to="610" dur="0.8s" begin="0s"/>
      </rect>
    </mask>

    <!-- Clip paths -->
    <clipPath id="panelClip">
      <rect x="8" y="8" width="1164" height="594" rx="16" ry="16"/>
    </clipPath>

    <clipPath id="leftClip">
      <rect x="20" y="20" width="424" height="570" rx="12" ry="12"/>
    </clipPath>

    <clipPath id="rightClip">
      <rect x="464" y="20" width="696" height="570" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" fill="#030712"/>
  
  <!-- Animated background gradients -->
  <rect width="1180" height="610" fill="url(#bgGrad1-dark)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="1180" height="610" fill="url(#bgGrad2-dark)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect width="1180" height="610" fill="url(#bgGrad3-dark)">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle cx="100" cy="100" r="1.5" fill="#22D3EE" opacity="0.6">
    <animate attributeName="cy" values="100;200;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="500" r="1" fill="#7C3AED" opacity="0.5">
    <animate attributeName="cy" values="500;400;500" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="150" r="1.2" fill="#10B981" opacity="0.4">
    <animate attributeName="cy" values="150;280;150" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Main container with mask -->
  <g mask="url(#revealMask)">
    <!-- Outer border with shimmer -->
    <rect x="8" y="8" width="1164" height="594" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="8" y="8" width="1164" height="594" rx="16" ry="16" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1" opacity="0.3">
      <animate attributeName="stroke-dasharray" values="0,3668;3668,0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- Glass panel background -->
    <rect x="8" y="8" width="1164" height="594" rx="16" ry="16" fill="#0F172A" opacity="0.4" filter="url(#blurGlass-dark)"/>

    <!-- Glass reflection -->
    <ellipse cx="590" cy="150" rx="400" ry="150" fill="white" opacity="0.03"/>

    <!-- LEFT SECTION: ASCII Art -->
    <g clip-path="url(#leftClip)">
      <!-- ASCII Container -->
      <g>
        <!-- Floating animation -->
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="4s" repeatCount="indefinite"/>
        
        <!-- ASCII Portrait with line-by-line reveal -->
        <text x="60" y="80" font-family="'Courier New', monospace" font-size="11" fill="url(#asciiGrad-dark)" opacity="0.9" letter-spacing="1" filter="url(#glowAscii-dark)">
          <tspan x="60" dy="0">╔════════════════╗</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.2s"/>
          <tspan x="60" dy="16">║  ╭───────╮  ║</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s"/>
          <tspan x="60" dy="16">║  │ ◔◡◔ │  ║</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s"/>
          <tspan x="60" dy="16">║  ╰───────╯  ║</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s"/>
          <tspan x="60" dy="16">║ Developer   ║</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s"/>
          <tspan x="60" dy="16">║ Enthusiast  ║</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s"/>
          <tspan x="60" dy="16">╚════════════════╝</tspan>
          <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s"/>
        </text>

        <!-- Blinking cursor -->
        <rect x="58" y="340" width="2" height="14" fill="#22D3EE" opacity="0.8" filter="url(#glowAscii-dark)">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="1.6s"/>
        </rect>

        <!-- Additional ASCII details -->
        <text x="85" y="385" font-family="'Courier New', monospace" font-size="10" fill="#94A3B8" opacity="0.6" letter-spacing="0.5">
          <tspan x="85" dy="0">❯ Go • C</tspan>
          <animate attributeName="opacity" values="0;0.6" dur="0.5s" begin="2.0s"/>
          <tspan x="85" dy="14">❯ Docker • Git</tspan>
          <animate attributeName="opacity" values="0;0.6" dur="0.5s" begin="2.3s"/>
        </text>
      </g>
    </g>

    <!-- RIGHT SECTION: Terminal Content -->
    <g clip-path="url(#rightClip)">
      <!-- Terminal header -->
      <rect x="464" y="20" width="696" height="40" rx="12" fill="rgba(15,23,42,0.6)"/>
      <circle cx="490" cy="40" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="510" cy="40" r="5" fill="#FBBF24" opacity="0.8"/>
      <circle cx="530" cy="40" r="5" fill="#10B981" opacity="0.8"/>
      <text x="550" y="45" font-family="'Courier New', monospace" font-size="12" fill="#94A3B8">profile.sh</text>

      <!-- Content area -->
      <rect x="464" y="60" width="696" height="530" rx="0" fill="rgba(15,23,42,0.3)"/>

      <!-- Greeting with typing animation -->
      <text x="490" y="110" font-family="'Courier New', monospace" font-size="14" fill="#F8FAFC" font-weight="500">
        <tspan>Hi 👋</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.5s"/>
      </text>

      <!-- Name with typing -->
      <text x="490" y="145" font-family="'Courier New', monospace" font-size="18" fill="url(#accentGrad-dark)" font-weight="600" filter="url(#glow-dark)">
        <tspan>I'm Miraç BEDİR</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s"/>
      </text>

      <!-- Role typing animation -->
      <g>
        <text x="490" y="185" font-family="'Courier New', monospace" font-size="13" fill="#22D3EE" font-weight="500">
          <tspan>Backend Engineer</tspan>
        </text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s"/>
      </g>

      <g>
        <text x="490" y="210" font-family="'Courier New', monospace" font-size="13" fill="#A78BFA" font-weight="500">
          <tspan>Open Source Contributor</tspan>
        </text>
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.0s"/>
      </g>

      <!-- Info items with sequential reveal -->
      <g>
        <text x="490" y="260" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">📍 Istanbul, Turkey</text>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.4s"/>
      </g>

      <g>
        <text x="490" y="285" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">🎓 Computer Science</text>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.7s"/>
      </g>

      <g>
        <text x="490" y="310" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">⚡ Building scalable systems</text>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.0s"/>
      </g>

      <g>
        <text x="490" y="335" font-family="'Courier New', monospace" font-size="11" fill="#94A3B8">✉️ bedirmirac@gmail.com</text>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.3s"/>
      </g>

      <!-- Skills header -->
      <text x="490" y="380" font-family="'Courier New', monospace" font-size="12" fill="#F8FAFC" font-weight="600">
        <tspan>Skills</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.6s"/>
      </text>

      <!-- Skill pills -->
      <g>
        <!-- Go -->
        <rect x="490" y="395" width="50" height="28" rx="14" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.8" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="3.9s"/>
        </rect>
        <text x="515" y="415" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" font-weight="600" text-anchor="middle">Go</text>

        <!-- C -->
        <rect x="560" y="395" width="45" height="28" rx="14" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.8" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="4.2s"/>
        </rect>
        <text x="582" y="415" font-family="'Courier New', monospace" font-size="11" fill="#A78BFA" font-weight="600" text-anchor="middle">C</text>

        <!-- Docker -->
        <rect x="625" y="395" width="65" height="28" rx="14" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.8" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="4.5s"/>
        </rect>
        <text x="657" y="415" font-family="'Courier New', monospace" font-size="11" fill="#10B981" font-weight="600" text-anchor="middle">Docker</text>

        <!-- Git -->
        <rect x="710" y="395" width="45" height="28" rx="14" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.8" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.8" dur="0.3s" begin="4.8s"/>
        </rect>
        <text x="732" y="415" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" font-weight="600" text-anchor="middle">Git</text>
      </g>

      <!-- Social icons -->
      <g>
        <!-- GitHub -->
        <circle cx="520" cy="480" r="18" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.6" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="5.1s"/>
        </circle>
        <text x="520" y="486" font-size="16" text-anchor="middle" fill="#F8FAFC">🐙</text>

        <!-- LinkedIn -->
        <circle cx="570" cy="480" r="18" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.6" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="5.4s"/>
        </circle>
        <text x="570" y="486" font-size="16" text-anchor="middle" fill="#F8FAFC">💼</text>

        <!-- Twitter -->
        <circle cx="620" cy="480" r="18" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.6" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="5.7s"/>
        </circle>
        <text x="620" y="486" font-size="16" text-anchor="middle" fill="#F8FAFC">𝕏</text>

        <!-- Portfolio -->
        <circle cx="670" cy="480" r="18" fill="none" stroke="url(#accentGrad-dark)" stroke-width="1.5" opacity="0.6" filter="url(#glow-dark)">
          <animate attributeName="opacity" values="0;0.6" dur="0.3s" begin="6.0s"/>
        </circle>
        <text x="670" y="486" font-size="16" text-anchor="middle" fill="#F8FAFC">🌐</text>
      </g>

      <!-- Scanline effect -->
      <rect x="464" y="60" width="696" height="530" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.05" stroke-dasharray="0,2">
        <animate attributeName="stroke-dashoffset" from="0" to="1000" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Border glow effect -->
  <rect x="8" y="8" width="1164" height="594" rx="16" ry="16" fill="none" stroke="url(#accentGrad-dark)" stroke-width="2" opacity="0.1">
    <animate attributeName="stroke-width" values="2;3;2" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>